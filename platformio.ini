[platformio]
default_envs = jc1060

[env:jc1060]
# Pinned to 55.03.37, matching the C6 co-processor's firmware (2.11.6 via
# dpoler/c6_updater). DO NOT bump to 55.03.39 (ESP-Hosted 2.12.8) again
# without a strong reason and a hardware-tested plan to revert -- that exact
# pairing (host+C6 both on 2.12.8, versions matched, confirmed via boot log)
# was tried on 2026-07-24 and reliably crashed with
# "assert failed: sdio_rx_get_buffer" within ~10 seconds of every single
# boot. That's the same open upstream ESP-Hosted DMA-fragmentation bug
# tracked in project_p4_heap_constraints memory (espressif/esp-hosted-mcu
# issues #144/#167) -- matching versions did NOT fix it, and 2.12.8
# reproduces it far more severely on this board than 2.11.6 does (2.11.6
# went from crashing multiple times/hour to not crashing at all once C6 was
# updated to match). 2.11.6/2.11.6 is the confirmed-stable pairing -- see
# project_platform_pin memory for the full trail.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
framework = arduino
board = esp32-p4-evboard
board_build.psram = enabled
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@^9.2.2
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -O3
    -DLV_CONF_INCLUDE_SIMPLE
    -I .
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_ETHERNET
src_filter =
    +<*>
    -<main_cyd.cpp>
    -<waveshare/>

[env:waveshare]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram = enabled
board_build.partitions = partitions_s3.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@^9.2.2
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -O2
    -DLV_CONF_INCLUDE_SIMPLE
    -I .
    -I src
    -I src/waveshare
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_WIFI
    -DCONFIG_LCD_HRES=1024
    -DCONFIG_LCD_VRES=600
src_filter =
    +<*>
    -<main.cpp>
    -<main_cyd.cpp>
    -<hal/jd9165_lcd.cpp>
    -<hal/esp_lcd_jd9165.c>

[env:cyd]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DUSER_SETUP_LOADED
    -DUSE_HSPI_PORT
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
src_filter =
    -<*>
    +<main_cyd.cpp>
