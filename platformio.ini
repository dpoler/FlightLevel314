[platformio]
default_envs = jc1060

[env:jc1060]
# Pinned to 55.03.37, matching the C6 co-processor's firmware (2.11.6 via
# dpoler/c6_updater). DO NOT bump to 55.03.39 (ESP-Hosted 2.12.8) again
# without a strong reason and a hardware-tested plan to revert -- that exact
# pairing (host+C6 both on 2.12.8, versions matched, confirmed via boot log)
# was tried on 2026-07-24 and reliably crashed with
# "assert failed: sdio_rx_get_buffer" within ~10 seconds of every single
# boot. That's the same open upstream ESP-Hosted DMA-fragmentation bug
# tracked in project_p4_heap_constraints memory (espressif/esp-hosted-mcu
# issues #144/#167) -- matching versions did NOT fix it, and 2.12.8
# reproduces it far more severely on this board than 2.11.6 does (2.11.6
# went from crashing multiple times/hour to not crashing at all once C6 was
# updated to match). 2.11.6/2.11.6 is the confirmed-stable pairing -- see
# project_platform_pin memory for the full trail.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
framework = arduino
board = esp32-p4-evboard
board_build.psram = enabled
board_build.partitions = partitions.csv
monitor_speed = 115200
# Excludes crowpanel's EK79007 panel driver -- PlatformIO compiles every .cpp/
# .c under src/ for every env by default regardless of main.cpp's #ifdef
# BOARD_CROWPANEL type-alias dispatch (that only guards which header gets
# #included, not whether the other board's .cpp file gets compiled at all).
# ek79007_lcd.cpp references LCD_LED_PWM_HZ/LCD_MIPI_DSI_LANE_NUM/LCD_DPI_*
# etc., which only exist in pins_config_crowpanel.h -- broke this env's build
# outright the first time it was rebuilt after the CrowPanel groundwork
# commit added that file (2026-07-25 add, never actually build-tested against
# jc1060 until this failure surfaced on 2026-07-26).
build_src_filter =
    +<*>
    -<hal/ek79007_lcd.cpp>
    -<hal/esp_lcd_ek79007.c>
lib_deps =
    lvgl/lvgl@^9.2.2
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -O3
    -DLV_CONF_INCLUDE_SIMPLE
    -I .
    -I src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_ETHERNET

[env:crowpanel]
# Elecrow CrowPanel ESP32-P4 Advance, 10.1" HMI Display, SKU DHE04310D,
# hardware/software V1.1. Additive only -- jc1060 above is untouched.
# UNBUILT, UNTESTED. Every value below was pulled from Elecrow's own
# GitHub repo (Elecrow-RD/CrowPanel-Advanced-10.1inch-ESP32-P4-HMI-AI-
# Display-1024x600-IPS-Touch-Screen, V1.1 Arduino_Code/idf-code examples)
# on 2026-07-25, not guessed -- see BOARD_CROWPANEL in pins_config.h and
# sdkconfig.defaults.crowpanel for the specifics and their sourcing.
#
# SAME OPEN RISK AS jc1060's PLATFORM PIN COMMENT ABOVE, LIKELY WORSE:
# this board's onboard ESP32-C6 ships factory-programmed with ESP-Hosted
# firmware "V2.12.3" (per Elecrow's own
# "Advance_P4_On-Board_ESP32C6_Firmware_V2.12.3_2026_04_08" folder) --
# the same family as the 2.12.8 pairing that reliably crashed jc1060 with
# "assert failed: sdio_rx_get_buffer" (see project_platform_pin memory,
# espressif/esp-hosted-mcu issues #144/#167). Pinned to the SAME platform
# version as jc1060 below (55.03.37 / ESP-Hosted 2.11.6) since that's the
# only pairing this project has ever confirmed stable -- but that means
# host and C6 will almost certainly be VERSION-MISMATCHED out of the box
# (host 2.11.6 vs C6 2.12.3), which historically degrades or breaks WiFi
# on its own, separate from the crash bug. Elecrow ships a C6 downgrade
# tool ("host_performs_slave_ota.zip" in the same GitHub repo, under
# "Upgrade P4 to C6 firmware") that may be able to bring the C6 down to
# 2.11.6 to match -- not attempted here, needs real hardware. Try the
# mismatched pairing first and see what actually happens before reaching
# for the downgrade tool; either way, expect this to need real
# back-and-forth once hardware testing starts, not a clean first boot.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
framework = arduino
board = esp32-p4-evboard
board_build.psram = enabled
board_build.partitions = partitions.csv
# Elecrow's own V1.1 example project's SDIO pin/bus-width Kconfig for this
# exact board revision -- see sdkconfig.defaults.crowpanel for the values
# and their source. UNCONFIRMED whether board_build.cmake_extra_args'
# -DSDKCONFIG_DEFAULTS mechanism (documented for pioarduino/platform-
# espressif32 ESP-IDF component builds) also takes effect under
# framework=arduino the way it does under framework=espidf -- Arduino is
# built as an IDF component either way on this platform, so it should, but
# this has not been build-tested.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults.crowpanel"
# Excludes jc1060's JD9165 panel driver -- see jc1060's build_src_filter
# comment above for why this is needed in both directions (PlatformIO
# compiles every .cpp/.c under src/ for every env by default).
build_src_filter =
    +<*>
    -<hal/jd9165_lcd.cpp>
    -<hal/esp_lcd_jd9165.c>
monitor_speed = 115200
# esptool defaults to its fastest negotiated baud (1.5Mbps) for the actual
# flash write once the stub is running. That handshake failed here
# ("No serial data received" right after "Changing baud rate to 1500000")
# over this board's WCH CH34x-family USB-serial bridge on macOS. 115200
# worked but is slow (~110s uploads) -- bumped to 230400, a real-world
# documented safe ceiling for this exact combination: another CrowPanel
# project on the same CH340-family chip found 460800 "doesn't ack reliably
# once flashing starts" and settled on 230400 as the safe ceiling
# (tburkhalterr/CANShift#238). If 230400 turns out unreliable here too, drop
# back to 115200 rather than assuming a number in between is safe.
upload_speed = 230400
lib_deps =
    lvgl/lvgl@^9.2.2
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -O3
    -DLV_CONF_INCLUDE_SIMPLE
    -I .
    -I src
    # ARDUINO_USB_MODE=0 (not jc1060's 1) -- real hardware has TWO separate
    # USB ports here, labeled UART0 (the WCH bridge -- flashing, ROM banner,
    # ESP-IDF log_e/ESP_LOGE lines) and USB2.0 (unconnected/no device at all
    # under MODE=1, confirmed on hardware). The schematic's net names explain
    # why: the P4 has two distinct native USB pin pairs, USB1_D+/D- and
    # USB2_D+/D- -- MODE=1 selects Serial=HWCDCSerial (Hardware JTAG-CDC),
    # which is presumably USB1 and isn't broken out to either connector on
    # this board at all (nothing ever reached the USB2.0 port with that
    # setting). MODE=0 selects Serial=USBSerial (native USB-OTG device mode)
    # instead, which the "USB2.0" label suggests is the one actually wired to
    # that connector -- reasoned from the schematic, NOT yet hardware-
    # confirmed. If this doesn't work either, don't try a third USB-mode
    # combination blind -- fall back to adding the airportdb.io token field
    # back to the on-device Settings panel instead (see settings.cpp's
    # layout comment for why it was dropped from there originally).
    #
    # CONFIRMED WORKING on real hardware (2026-07-26): with both cables
    # connected, tools/configure_device.sh talks to the device fine over the
    # USB2.0 port. One gotcha for `pio device monitor`/app-level log
    # watching specifically: it defaults to whatever port it auto-detects
    # for upload, which is the UART0/WCH-bridge one (that's what esptool
    # flashes through) -- NOT the USB2.0 port Serial actually prints to. Use
    # `pio device monitor --port /dev/cu.usbmodemXXXX` (or PlatformIO's
    # `--monitor-port`) explicitly to see this app's own Serial output;
    # UART0's monitor will only ever show the ROM banner and ESP-IDF
    # log_e/ESP_LOGE lines, never "ADS-B Display starting..." or anything
    # else this app prints itself.
    #
    # TWO CABLES IS A DELIBERATE, CONSIDERED TRADE-OFF, not an oversight --
    # investigated collapsing to one on 2026-07-26 and it's genuinely hard:
    # flashing can't move to USB2.0 (ESP32-P4's ROM bootloader only supports
    # UART or the dedicated USB-Serial-JTAG peripheral, neither of which is
    # this board's general-purpose USB-OTG "USB2.0" port; USB-Serial-JTAG
    # isn't wired to either connector on this board at all, confirmed by
    # testing). Moving Serial to UART0 instead (matching the flash port) hit
    # the same kind of precompiled-libs wall as the SDIO bus-width issue
    # above: the precompiled esp32p4 sdkconfig has
    # CONFIG_ESP_CONSOLE_UART_DEFAULT=y, meaning ESP-IDF's own console
    # already owns UART0 from boot (that's how the ROM banner/log_e lines
    # get out for free) -- Arduino's HardwareSerial has no special-case
    # handling for that (checked HardwareSerial.cpp directly) and hung the
    # board outright when tried. A narrower fix (reading/writing UART0 via
    # raw uart_read_bytes()/uart_write_bytes() against the already-installed
    # console driver, instead of a second HardwareSerial.begin()) might work
    # but is unverified -- explicitly deferred rather than attempted blind,
    # given this exact area has already caused one hang and one silent
    # failure. If picked back up, that's where to start.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_CROWPANEL=1
    # No -DUSE_ETHERNET -- Elecrow's own spec sheet for this board lists no
    # Ethernet PHY (USB2.0/UART/I2C/GPIO/SD/battery/speaker/camera/module
    # headers only), unlike jc1060. fetcher.cpp's #if defined(USE_ETHERNET)
    # blocks reference jc1060-specific PHY pins that don't exist here, so
    # this must stay undefined for this env -- settings.cpp's Ethernet
    # switch will need hiding for this board too (not done yet, see the
    # note in pins_config_crowpanel.h).
