name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Stamp version into source
        run: echo '#define FIRMWARE_VERSION_STR "${{ github.ref_name }}"' > src/version.h

      # Two board targets, one release -- data/ota.cpp expects each board's
      # asset under exactly these names (firmware-<env>.bin), selected at
      # compile time via BOARD_CROWPANEL. Adapted from dpoler/FlightRadarCYD's
      # release.yml, which only ever had the one board to build.
      - name: Build jc1060
        run: pio run -e jc1060

      - name: Build crowpanel
        run: pio run -e crowpanel

      - name: Rename firmware binaries for release
        run: |
          cp .pio/build/jc1060/firmware.bin firmware-jc1060.bin
          cp .pio/build/crowpanel/firmware.bin firmware-crowpanel.bin

      - name: Create release and attach firmware
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-jc1060.bin
            firmware-crowpanel.bin
          generate_release_notes: true
