name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Stamp version into source
        run: echo '#define FIRMWARE_VERSION_STR "${{ github.ref_name }}"' > src/version.h

      # data/ota.cpp expects the asset under exactly this name
      # (firmware-jc1060.bin). Adapted from dpoler/FlightRadarCYD's
      # release.yml.
      - name: Build jc1060
        run: pio run -e jc1060

      - name: Rename firmware binary for release
        run: cp .pio/build/jc1060/firmware.bin firmware-jc1060.bin

      - name: Create release and attach firmware
        uses: softprops/action-gh-release@v2
        with:
          files: firmware-jc1060.bin
          generate_release_notes: true
